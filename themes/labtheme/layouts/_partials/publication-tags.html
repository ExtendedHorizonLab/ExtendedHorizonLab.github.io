{{ $topics := where site.Data.publication_tags "id" "in" .Params.paper_tags }}
{{ with $topics }}
<div class="pub-tags" aria-label="Research topics">
  {{ range . }}
    <a class="pub-tag" href="{{ "publications/" | relURL }}?tag={{ .id }}" data-paper-tag="{{ .id }}" title="{{ .description }}">{{ .label }}</a>
  {{ end }}
</div>
{{ end }}
