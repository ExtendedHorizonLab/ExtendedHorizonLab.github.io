<div class="header-content">
  <div class="logo">
    <a href="{{ "/" | relURL }}" class="logo-link">
      <img src="{{ "images/logo.png" | relURL }}" alt="{{ site.Title }}" class="logo-img wordmark-light" />
      <img src="{{ "images/logo-visor-blue.png" | relURL }}" alt="{{ site.Title }}" class="logo-img wordmark-dark">
    </a>
  </div>
  <nav>
    <ul>
      {{ range site.Menus.main }}
        <li>
          <a href="{{ .URL }}"{{ if $.IsMenuCurrent "main" . }} class="active"{{ end }}>
            {{ .Name }}
          </a>
        </li>
      {{ end }}
      {{ with site.Params.labworkspaceurl }}
        <li><a class="lab-workspace-link" href="{{ . }}" aria-label="Member Portal (lab members only)" title="Lab members only"><span class="lab-workspace-lock" aria-hidden="true"></span>Member Portal</a></li>
      {{ end }}
      <li>
          <a href="javascript:void(0)" id="theme-toggle">
            &#9790;
          </a>
        </li>
    </ul>
  </nav>
</div>
